<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative RSAgent question and result</title>
  <desc id="desc">A synthetic aerial scene with buildings and a road is paired with an illustrative question asking to show buildings near a road. The output panel depicts selected buildings, a possible answer and artifacts. This is a schematic, not an actual model prediction.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091625"/><stop offset="1" stop-color="#142d3b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#69dfcb"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#effaf7}.muted{fill:#a8c2c8;font-size:21px}.small{fill:#a8c2c8;font-size:18px}.label{fill:#69dfcb;font-size:18px;font-weight:700;letter-spacing:2px}.title{font-weight:700;font-size:28px}</style>
  </defs>
  <rect width="1600" height="760" rx="30" fill="url(#bg)"/>
  <text x="60" y="65" class="label">AN EXAMPLE  /  ILLUSTRATIVE ONLY</text>
  <text x="60" y="113" font-size="40" font-weight="750">Ask a spatial question</text>
  <text x="60" y="150" class="muted">A synthetic scene shows the kind of evidence an agent can combine.</text>

  <rect x="60" y="195" width="600" height="415" rx="20" fill="#172e39" stroke="#385769" stroke-width="2"/>
  <rect x="84" y="220" width="552" height="308" rx="14" fill="#426947"/>
  <path d="M84 408 C202 348 340 451 636 316 L636 370 C383 500 206 400 84 462Z" fill="#879495"/>
  <path d="M84 434 C213 377 351 477 636 343" fill="none" stroke="#d9d3b8" stroke-width="4" stroke-dasharray="16 14"/>
  <path d="M118 254 H230 V318 H118Z M275 250 H359 V308 H275Z M457 242 H559 V309 H457Z M159 480 H267 V512 H159Z M443 449 H557 V502 H443Z" fill="#d3c2a1" stroke="#eedfc4" stroke-width="3"/>
  <path d="M151 472 H275 V520 H151Z M435 441 H565 V510 H435Z" fill="none" stroke="#69dfcb" stroke-width="5" stroke-dasharray="10 6"/>
  <path d="M113 253 L174 225 L235 253 M270 249 L317 225 L364 249 M452 241 L508 219 L564 241" fill="#a65d4c" stroke="#df9274" stroke-width="3"/>
  <circle cx="108" cy="317" r="17" fill="#264f39"/><circle cx="603" cy="262" r="22" fill="#264f39"/><circle cx="337" cy="490" r="20" fill="#264f39"/>
  <text x="90" y="574" class="small">SYNTHETIC INPUT IMAGE</text>

  <path d="M676 390 H749" fill="none" stroke="#69dfcb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="765" y="195" width="775" height="415" rx="20" fill="#142e3b" stroke="#385769" stroke-width="2"/>
  <text x="797" y="240" class="label">QUESTION</text>
  <text x="797" y="281" class="title">“Show buildings near the road.”</text>
  <path d="M797 308 H1508" stroke="#375461" stroke-width="2"/>
  <text x="797" y="352" class="label">POSSIBLE WORKFLOW</text>
  <text x="797" y="389" class="muted">Building mask + road segmentation + spatial review</text>
  <text x="797" y="439" class="label">ILLUSTRATIVE ANSWER</text>
  <text x="797" y="477" class="muted">“The highlighted buildings are near the road.”</text>
  <text x="797" y="526" class="small">Possible outputs: highlighted image, masks, and execution trace.</text>
  <text x="797" y="556" class="small">The actual plan and answer depend on the image and models.</text>
  <rect x="60" y="642" width="1480" height="65" rx="12" fill="#1b4141"/>
  <text x="84" y="683" font-size="20" fill="#d0eee7">This is a conceptual illustration, not a model run, measured distance, or recorded prediction.</text>
</svg>
